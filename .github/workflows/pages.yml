name: Deploy Slowfield Audio site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Fetch prepared site
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-751c-81f4-8298-d8bce1bb549c/raw?se=2026-09-21T19%3A47%3A10Z&sp=r&sv=2026-02-06&sr=b&scid=860d3712-5ec4-55dc-bb66-b7d2cea8eda2&skoid=56822d8b-6cfd-42ed-a00d-1452dca42036&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-21T09%3A52%3A19Z&ske=2026-09-22T09%3A52%3A19Z&sks=b&skv=2026-02-06&sig=i5GIGSSGLnpy7R5N1Npg6tGRXSQ3U1hqoI0Vx1XmV84%3D' -o site.zip
          mkdir -p public
          unzip -q site.zip -d public
          printf '%s\n' 'plugins.slowfieldaudio.com' > public/CNAME
          touch public/.nojekyll
          test -f public/index.html
          test -f public/minimusmaximus_beta_product_page/index.html
          test -f public/downloads/minimusmaximus/MinimusMaximus-2.12.7-Windows-Setup.exe
          test -f public/downloads/minimusmaximus/MinimusMaximus-2.12.7-macOS.pkg

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
