name: Deploy Slowfield Audio site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Restore latest published site
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p public
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=github-pages&per_page=100"
          ARTIFACT_ID=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${API}" | python3 -c 'import json,sys; d=json.load(sys.stdin); a=[x for x in d.get("artifacts",[]) if not x.get("expired")]; print(a[0]["id"] if a else "")')
          if [ -z "${ARTIFACT_ID}" ]; then
            echo "No previous Pages artifact found"
            exit 1
          fi
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" -o previous-pages.zip
          mkdir -p previous-pages
          unzip -q previous-pages.zip -d previous-pages
          test -f previous-pages/artifact.tar
          tar -xf previous-pages/artifact.tar -C public
          printf '%s\n' 'plugins.slowfieldaudio.com' > public/CNAME
          touch public/.nojekyll

      - name: Publish expanded Motus product page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/motus_beta_product_page
          install -m 0644 motus_beta_product_page.html public/motus_beta_product_page/index.html
          test -s public/motus_beta_product_page/index.html
          grep -q 'Not another bank of LFOs' public/motus_beta_product_page/index.html
          grep -q 'Seven areas of motion' public/motus_beta_product_page/index.html
          grep -q 'Built for sounds that need a life beyond the loop' public/motus_beta_product_page/index.html

      - name: Verify preserved site
        shell: bash
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/plugins.html
          test -f public/perculator_beta_product_page/index.html
          test -f public/motus_beta_product_page/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
