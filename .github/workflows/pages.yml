name: Deploy Slowfield Audio site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Restore current live site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public
          wget --quiet --mirror --page-requisites --adjust-extension --convert-links --no-parent --no-host-directories --directory-prefix=public https://plugins.slowfieldaudio.com/
          test -f public/index.html
          printf '%s\n' 'plugins.slowfieldaudio.com' > public/CNAME
          touch public/.nojekyll

      - name: Publish expanded Motus product page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/motus_beta_product_page
          install -m 0644 motus_beta_product_page.html public/motus_beta_product_page/index.html
          test -s public/motus_beta_product_page/index.html
          grep -q 'Not another bank of LFOs' public/motus_beta_product_page/index.html
          grep -q 'Seven areas of motion' public/motus_beta_product_page/index.html
          grep -q 'Built for sounds that need a life beyond the loop' public/motus_beta_product_page/index.html

      - name: Verify preserved site
        shell: bash
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/motus_beta_product_page/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
